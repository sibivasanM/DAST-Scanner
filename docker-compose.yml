services:
  # ── ZAP Daemon ──────────────────────────────────────────────────────────────
  zap:
    container_name: vulnerability-scanner-zap
    image: ghcr.io/zaproxy/zaproxy:stable
    environment:
      # ZAP's startup script reads host RAM via `free -m` and ignores Docker limits.
      # _JAVA_OPTIONS is picked up by the JVM launcher itself before zap.sh runs,
      # so it wins over the script's auto-calculated -Xmx.
      - "_JAVA_OPTIONS=-Xmx${ZAP_HEAP_MB:-700}m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseContainerSupport"
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY:-vulnforge-zap-key}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=false
      -config connection.timeoutInSecs=120
      -config spider.maxDuration=${ZAP_SPIDER_DURATION:-10}
      -config scanner.maxScanDurationInMins=${ZAP_SCAN_DURATION:-60}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - zap-data:/zap/wrk
      - zap-scripts:/zap/scripts/vulnforge
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/?apikey=${ZAP_API_KEY:-vulnforge-zap-key}"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    # mem_limit works in non-swarm compose; deploy.resources is for swarm.
    # Both set for maximum compatibility.
    mem_limit: ${ZAP_MEMORY_LIMIT:-1200m}
    memswap_limit: ${ZAP_MEMORY_LIMIT:-1200m}
    deploy:
      resources:
        limits:
          memory: ${ZAP_MEMORY_LIMIT:-1200m}
        reservations:
          memory: 256M

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    container_name: vulnerability-scanner-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ZAP_API_URL=http://zap:8080
      - ZAP_API_KEY=${ZAP_API_KEY:-vulnforge-zap-key}
      - ZAP_HOST=zap
      - PYTHONUNBUFFERED=1
      - MAX_CONCURRENT_SCANS=${MAX_CONCURRENT_SCANS:-3}
      - NUCLEI_AUTO_UPDATE=${NUCLEI_AUTO_UPDATE:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - DATABASE_PATH=/app/data/vulnforge.db
    volumes:
      - scan-data:/app/data
      - screenshots:/app/screenshots
      - zap-scripts:/app/zap-scripts
      - ./selenium:/app/selenium
    depends_on:
      zap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2G}
    memswap_limit: ${BACKEND_MEMORY_LIMIT:-2G}
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
        reservations:
          memory: 512M

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    container_name: vulnerability-scanner-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  scan-data:
    driver: local
  screenshots:
    driver: local
  zap-data:
    driver: local
  zap-scripts:
    driver: local
